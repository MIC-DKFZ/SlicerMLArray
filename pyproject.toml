# Only for the pure-Python tests (SlicerMLArray/SlicerMLArrayLib without Slicer). The extension itself is
# distributed through the 3D Slicer Extensions Index, not PyPI.
[project]
name = "slicermlarray-tests"
version = "0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mlarray>=1.0.0,<2"]

[project.optional-dependencies]
test = ["pytest>=7", "medvol>=1.0.1", "nibabel", "pynrrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["SlicerMLArray"]
